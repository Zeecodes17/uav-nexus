<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Speed & Wind Physics Explorer</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">

<a href="physics.html" class="menu-btn" style="background:#444;">
← Back to Flight Physics Tools
</a>

<h2>Speed & Wind Physics Explorer</h2>

<!-- INPUTS -->

<label>Vehicle Weight (kg)</label>
<input type="range" id="weight" min="0.5" max="25" step="0.1" value="2">
<div class="small-text" id="wVal">2.0 kg</div>

<label>Forward Speed (km/h)</label>
<input type="range" id="speed" min="0" max="100" step="1" value="30">
<div class="small-text" id="sVal">30 km/h</div>

<label>Wind Speed (km/h)</label>
<input type="range" id="wind" min="0" max="60" step="1" value="10">
<div class="small-text" id="wdVal">10 km/h</div>

<label>Wind Direction</label>
<select id="windType">
<option value="head">Headwind</option>
<option value="cross">Crosswind</option>
</select>

<label>Air Density</label>
<select id="density">
<option value="1.225">Sea Level</option>
<option value="1.06">Hot Day</option>
<option value="0.9">High Altitude</option>
</select>

<label>Drag Profile</label>
<select id="drag">
<option value="0.8">Low</option>
<option value="1.1" selected>Typical</option>
<option value="1.5">High</option>
</select>

<hr>

<!-- RESULTS -->

<h3>Physics Results</h3>

<div class="result-box">
<p><b>Relative Airspeed:</b> <span id="airOut">–</span> km/h</p>
<p><b>Drag / Lateral Force:</b> <span id="forceOut">–</span> N</p>
<p><b>Equivalent Thrust:</b> <span id="thrustOut">–</span> kg</p>
<p><b>Tilt Angle Required:</b> <span id="tiltOut">–</span> °</p>
<p><b>Thrust Margin Used:</b> <span id="marginOut">–</span> %</p>
</div>

<!-- BAR GRAPHS -->

<div class="bar-graph">

<div class="bar-container">
<div class="bar load" id="forceBar"></div>
<span class="bar-value" id="forceBarVal">– N</span>
<span class="bar-label">Aerodynamic Force</span>
</div>

<div class="bar-container">
<div class="bar peak" id="thrustBar"></div>
<span class="bar-value" id="thrustBarVal">– kg</span>
<span class="bar-label">Thrust Needed</span>
</div>

<div class="bar-container">
<div class="bar capability" id="marginBar"></div>
<span class="bar-value" id="marginBarVal">– %</span>
<span class="bar-label">Margin Used</span>
</div>

</div>

</div>

<script>
const g = 9.81;
const A = 0.1;

const w = weight, s = speed, wd = wind;
const wt = windType, d = density, cd = drag;

function update(){
const W = +w.value;
const V = (+s.value + +wd.value)/3.6;
const rho = +d.value;
const Cd = +cd.value;

wVal.textContent = W.toFixed(1)+" kg";
sVal.textContent = s.value+" km/h";
wdVal.textContent = wd.value+" km/h";

const F = 0.5*rho*Cd*A*V*V;
const thrustKg = F/g;

let tilt = 0;
if(wt.value==="cross"){
tilt = Math.atan(F/(W*g))*180/Math.PI;
}

const marginUsed = Math.min((thrustKg/W)*100,100);

airOut.textContent = (V*3.6).toFixed(1);
forceOut.textContent = F.toFixed(2);
thrustOut.textContent = thrustKg.toFixed(2);
tiltOut.textContent = tilt.toFixed(1);
marginOut.textContent = marginUsed.toFixed(1);

forceBar.style.height = Math.min(F/20*100,100)+"%";
thrustBar.style.height = Math.min(thrustKg/2*100,100)+"%";
marginBar.style.height = marginUsed+"%";

forceBarVal.textContent = F.toFixed(1)+" N";
thrustBarVal.textContent = thrustKg.toFixed(2)+" kg";
marginBarVal.textContent = marginUsed.toFixed(0)+" %";
}

[w,s,wd,wt,d,cd].forEach(e=>e.addEventListener("input",update));
update();
</script>

<script src="script.js"></script>
</body>
</html>
